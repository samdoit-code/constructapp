name: Deploy Apps Script Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      # A change to this workflow must re-run it. Without this, a fix to the
      # deploy pipeline itself never gets exercised until the next unrelated
      # backend commit happens to come along — which is exactly how a broken
      # push step stayed broken across three "successful" deploys.
      - ".github/workflows/deploy-backend.yml"
  # Manual re-run, for recovering from a bad or skipped deploy without having
  # to invent a backend commit to trigger one.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The suite drives the real backend/Code.js through real doPost() calls, so
      # it is the cheapest possible check that this commit's authorization and
      # conflict handling still behave before it reaches the live Web App.
      # Failing here means nothing is pushed and nothing is redeployed.
      - name: Run regression suite
        run: node tests/run.js

      - name: Install clasp
        # Pinned (not "@latest") so this workflow's exact command/output
        # assumptions below don't silently break on some future clasp release.
        run: npm install -g @google/clasp@3.4.0

      - name: Configure clasp
        env:
          CLASP_CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
          CLASP_CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
          CLASP_REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
        run: |
          cat > ~/.clasprc.json <<EOF
          {
            "token": {
              "access_token": "",
              "refresh_token": "${CLASP_REFRESH_TOKEN}",
              "scope": "https://www.googleapis.com/auth/script.projects",
              "token_type": "Bearer"
            },
            "oauth2ClientSettings": {
              "clientId": "${CLASP_CLIENT_ID}",
              "clientSecret": "${CLASP_CLIENT_SECRET}",
              "redirectUri": "http://localhost"
            }
          }
          EOF

      # --force is REQUIRED in CI, not an optimization. When appsscript.json is
      # among the changed files, `clasp push` asks "Manifest file has been
      # updated. Do you want to push and overwrite?" — and its
      # confirmManifestUpdate() returns false immediately when
      # process.stdout.isTTY is false, which it always is on a runner. It then
      # prints "Skipping push." and exits 0, so the step goes green having
      # uploaded nothing. This is self-perpetuating: once the local manifest
      # differs from the remote one, EVERY later push is skipped the same way.
      #
      # That is not hypothetical — it happened here. A manifest timeZone change
      # froze the backend source for three consecutive "successful" deploys
      # while clasp update-deployment kept cutting new versions (21, 22, 23)
      # from the unchanged remote code. Login broke for everyone the moment the
      # frontend started calling a backend action that only existed in the
      # source that never landed.
      - name: Push to Apps Script
        working-directory: backend
        run: |
          set -o pipefail
          clasp push --force 2>&1 | tee push.log

          # `clasp push` exits 0 whether or not it actually uploaded anything,
          # so its exit code proves nothing — the log is the only evidence.
          # Fail loudly on anything that is not a proven push or a proven no-op,
          # rather than letting the deploy step below publish stale code.
          if grep -q "Skipping push" push.log; then
            echo "::error::clasp refused to push (declined the manifest overwrite). NOTHING was uploaded and the live backend is unchanged."
            exit 1
          fi
          if grep -q "Script is already up to date" push.log; then
            echo "Remote source already matches this commit — nothing to upload."
            exit 0
          fi
          if grep -qE "^Pushed (one file|[0-9]+ files) at " push.log; then
            echo "Source upload confirmed."
            exit 0
          fi
          echo "::error::clasp push produced no recognizable success line — refusing to deploy code that may not have uploaded. Full output above."
          exit 1

      # `clasp push` only updates the script project's source — it does NOT
      # move the live Web App URL (the stable /exec endpoint the frontend
      # calls) onto the new code. That only happens when the deployment tied
      # to that URL is updated to a new version, which previously had to be
      # done by hand (Deploy > Manage deployments > Edit > New version) and
      # was a real, repeated cause of "pushed but nothing changed" bugs. This
      # step does that redeploy automatically, targeting the SAME existing
      # deployment (never creating a new one, which would change the URL).
      - name: Deploy new version to the existing Web App deployment
        working-directory: backend
        run: |
          clasp list-deployments --json > deployments.json
          cat deployments.json
          DEPLOYMENT_ID=$(python3 - deployments.json <<'PYEOF'
          import json, sys
          with open(sys.argv[1]) as f:
              deployments = json.load(f)
          # The special "@HEAD" dev deployment has no versionNumber; the real
          # Web App deployment is the one that does. If there's ever more than
          # one versioned deployment, refuse to guess which is the live one.
          versioned = [d for d in deployments if d.get('versionNumber') is not None]
          if len(versioned) != 1:
              sys.stderr.write(
                  f"Expected exactly one versioned (non-HEAD) deployment, found {len(versioned)}.\n"
              )
              sys.exit(1)
          print(versioned[0]['deploymentId'])
          PYEOF
          )
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::Could not determine which Apps Script deployment is the live Web App — refusing to guess. See the deployment list above; if there's genuinely more than one, redeploy manually or update this workflow to pin the correct deployment ID."
            exit 1
          fi
          echo "Updating deployment $DEPLOYMENT_ID to a new version"
          clasp update-deployment "$DEPLOYMENT_ID" -d "Auto-deploy $GITHUB_SHA"
